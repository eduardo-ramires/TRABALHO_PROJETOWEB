name: E2E Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: menu
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      - name: Start backend
        working-directory: Menu-Back-End
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/menu?createDatabaseIfNotExist=true
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: root
        run: mvn spring-boot:run &

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: Menu-Front/package-lock.json

      - name: Start frontend
        working-directory: Menu-Front
        run: npm ci && npm run dev -- --host &

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/produtos && break
            echo "Waiting for backend... ($i/30)"
            sleep 10
          done

      - name: Wait for frontend
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:5173 && break
            echo "Waiting for frontend... ($i/20)"
            sleep 5
          done

      - name: Install Playwright dependencies
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          URL: http://localhost:5173/
          USER_NAME: Admin
          USER_PASSWORD: ${{ secrets.ADM_PASSWORD }}
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
